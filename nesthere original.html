// ══ RENDER GRIDS ══
function renderHomeGrid() {
  const grid = document.getElementById('home-prop-grid');
  if (!grid) return;
  grid.innerHTML = properties.slice(0,4).map(p => propCard(p, 'detail')).join('');
}























// content builders to keep the data compact
function hub(category, standfirst, cards, related) {
  const blocks = [{ type:'cards', items: cards }];
  if (related) blocks.push({ type:'related', items: related });
  return { category, standfirst, blocks };
}
function locationPage(name, avg, change, listings, areas) {
  return {
    category: 'Major towns and cities in the UK',
    standfirst: `Browse property for sale and to rent across ${name}, with local price trends and the most in-demand areas.`,
    blocks: [
      { type:'stats', items: [
        { v: avg, l: `Average asking price in ${name}` },
        { v: change, l: 'Change in the last 12 months' },
        { v: listings, l: 'Live listings right now' }
      ]},
      { type:'listings', area: name, title: `Homes in ${name}` },
      { type:'cta', heading: `Find your next home in ${name}`, text: 'Listings are updated throughout the day.', buttons: [
        { label: `Homes for sale in ${name}`, action: `catalogue:buy:${name}` },
        { label: `Homes to rent in ${name}`, action: `catalogue:rent:${name}`, variant: 'outline' }
      ]},
      { type:'cards', title: `Popular areas in ${name}`, items: areas.map(a => ({ title: a, blurb: `See homes around ${a}.`, action: `catalogue:buy:${name}` })) }
    ]
  };
}

function overseasPage(country, regions, avg) {
  return {
    category: 'Overseas',
    standfirst: `Find a place in the sun in ${country} \u2014 from ${regions}.`,
    blocks: [
      { type:'stats', items:[
        { v: avg, l:`Typical asking price in ${country}` },
        { v:'5\u201310%', l:'Indicative purchase costs', s:'Taxes & fees' },
        { v:'GBP \u2192 EUR', l:'Budget in local currency', s:'Use the converter' }
      ]},
      { type:'cta', heading:`Browse homes in ${country}`, text:'Overseas listings are illustrative in this prototype.', buttons:[
        { label:'Overseas homes for sale', action:'content:Overseas homes for sale' },
        { label:'Currency converter', action:'content:Currency converter', variant:'outline' }
      ]},
      { type:'related', items:['Overseas','Sell overseas property','Currency converter'] }
    ]
  };
}

// ══ COMPANY PAGES ══
function coNav(active) {
  const items = [['About','content:About'],['Press centre','content:Press centre'],['Careers','content:Careers'],['Investor relations','content:Investor relations'],['Home Views','content:Home Views'],['Contact us','content:Contact us']];
  return `<div class="co-nav">${items.map(([l,a]) => `<span class="co-pill${l===active?' active':''}" onclick="runAction('${a}')">${l}</span>`).join('')}</div>`;
}
function statRow(arr) { return arr.map(s => `<div class="ds-use"><div class="num">${s.num}</div><div class="lab">${s.lab}</div></div>`).join(''); }
function segCard(c) { return `<div class="adv-seg"><div class="adv-tag">${c.tag}</div><h3>${c.title}</h3><p>${c.desc}</p>${c.action ? `<span class="adv-link" onclick="runAction('${c.action}')">${c.cta||'Learn more'} \u2192</span>` : ''}</div>`; }

function renderMortgageCalc() {

  return `<div class="adv-wrap">

    <div class="mc2-grid">
      <div class="mc2-fields">
        ${field('price','Property price','350000',50000,2000000,5000)}
        ${field('deposit','Deposit','35000',0,1000000,5000)}
        ${field('rate','Interest rate (%)','4.5',0.5,10,0.1)}
        ${field('term','Term (years)','25',5,40,1)}
      </div>
      <div class="mc2-panel">
        <div id="mca-out"></div>
        <button class="btn btn-copper" style="width:100%;justify-content:center;margin-top:6px;" onclick="openContent('Mortgage in Principle')">Get a Mortgage in Principle</button>
        <button class="btn btn-outline" style="width:100%;justify-content:center;color:#fff;border-color:rgba(255,255,255,0.5);margin-top:10px;" onclick="runAction('catalogue:buy')">Browse homes for sale</button>
      </div>
    </div>
    <p class="mip-disclaimer">This is an estimate for guidance only and isn\u2019t a mortgage offer or financial advice. Your actual payments depend on the deal you\u2019re offered and your circumstances. Your home may be repossessed if you do not keep up repayments on a mortgage.</p>
  </div>`;
}
function mcRecalc() {
  const num = id => Number((document.getElementById(id) || {}).value) || 0;
  const price = num('mca-price'); let deposit = Math.min(num('mca-deposit'), price);
  const rate = num('mca-rate'), years = num('mca-term');
  const loan = Math.max(0, price - deposit), mr = rate / 100 / 12, n = years * 12;
  let monthly = (mr > 0 && n > 0) ? loan * mr * Math.pow(1 + mr, n) / (Math.pow(1 + mr, n) - 1) : (n ? loan / n : 0);
  const total = monthly * n, interest = Math.max(0, total - loan);
  const ltv = price ? Math.min(100, loan / price * 100) : 0, depPct = price ? Math.min(100, deposit / price * 100) : 0;
  const out = document.getElementById('mca-out'); if (!out) return;
  const gbp = x => '\u00a3' + Math.round(x).toLocaleString('en-GB');
  out.innerHTML = `<div class="mc2-lab">Estimated monthly payment</div>
    <div class="mc2-big">${gbp(monthly)}<span>/mo</span></div>
    <div class="mc2-mini">
      <div><div class="v">${gbp(loan)}</div><div class="l">Loan amount</div></div>
      <div><div class="v">${gbp(interest)}</div><div class="l">Total interest</div></div>
      <div><div class="v">${gbp(total)}</div><div class="l">Total repayable</div></div>
    </div>
    <div class="mc2-ltv"><span>Deposit ${depPct.toFixed(0)}%</span><span>${ltv.toFixed(0)}% LTV</span></div>
    <div class="mc2-bar"><div style="width:${ltv}%;"></div></div>`;
}
function mcSync(key, src) {
  const num = document.getElementById('mca-' + key), rng = document.getElementById('mca-' + key + '-r');
  if (num && rng) { if (src === 'range') num.value = rng.value; else rng.value = num.value; }
  mcRecalc();
}
